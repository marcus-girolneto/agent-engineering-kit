[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-engineering-kit"
version = "0.1.0"
description = "A working repository template for evidence-driven agent development and review."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{name = "Marcus Vinicius Girolneto Sousa"}]
dependencies = ["jsonschema>=4.26,<5"]

[project.scripts]
kit = "agent_kit.cli:main"

[dependency-groups]
dev = [
  "bandit[toml]>=1.8,<2",
  "detect-secrets>=1.5,<2",
  "httpx2>=2,<3",
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kit"]

[tool.uv]
required-version = "==0.13.1"

[tool.uv.workspace]
members = ["examples/python-api"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["exercises/review/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "examples/python-api/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/python-api/tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["agent_kit", "task_api"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.bandit]
exclude_dirs = ["tests", "exercises"]
