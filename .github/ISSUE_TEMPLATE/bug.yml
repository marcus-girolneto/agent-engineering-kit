name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, expected behavior and actual behavior. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, uv and repository revision.
    validations:
      required: true
